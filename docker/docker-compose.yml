version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEMO_MODE=true
      - ASR_PROVIDER=demo
      - LLM_PROVIDER=demo
      - DATABASE_URL=postgresql+asyncpg://clinscribe:clinscribe_dev@postgres:5432/clinscribe_db
      - DATABASE_SYNC_URL=postgresql://clinscribe:clinscribe_dev@postgres:5432/clinscribe_db
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=clinscribe
      - POSTGRES_PASSWORD=clinscribe_dev
      - POSTGRES_DB=clinscribe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
